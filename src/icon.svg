<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a28"/>
      <stop offset="50%" stop-color="#0e101a"/>
      <stop offset="100%" stop-color="#07080d"/>
    </linearGradient>
    <linearGradient id="o_grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007a"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <linearGradient id="l_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="l_shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Edge-to-Edge Square Tile Background -->
  <rect width="512" height="512" fill="url(#bg_grad)"/>
  <rect width="508" height="508" x="2" y="2" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Subtle ambient glow -->
  <circle cx="256" cy="256" r="100" fill="#7928ca" opacity="0.15" filter="blur(40px)"/>

  <!-- 'O' Ring: Center (256, 256), Radius 126, Stroke 46 -->
  <circle cx="256" cy="256" r="126" fill="none" stroke="url(#o_grad)" stroke-width="46"/>

  <!-- Halo cutout gap behind 'L' where it overlaps 'O' -->
  <path d="M 215,140 L 215,335 Q 215,360 240,360 L 360,360" 
        fill="none" stroke="#07080d" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 'L' Monogram: Overlapping inside and across bottom of 'O' -->
  <path d="M 215,140 L 215,335 Q 215,360 240,360 L 360,360" 
        fill="none" stroke="url(#l_grad)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" filter="url(#l_shadow)"/>
</svg>