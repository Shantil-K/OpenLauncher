<!DOCTYPE html>
<html>

<head>
	<title>OpenLauncher</title>
</head>


<link rel="stylesheet" href="css/main.css">
<script src="js/wallpaper.js"></script>
	<script src="js/lib/QwQwebosTV.js/main.js"></script>  
<script src="js/main.js"></script>

<body>
	<!-- Wallpaper is a looping video (hardware decoded, unlike CSS background images). Built by scripts/make-wallpaper-video.sh; if it is missing the old image rotation takes over. -->
	<video id="bgvideo" src="access/wallpaper/loop.mp4" autoplay loop muted playsinline onerror="startimagewallpapers()" onloadedmetadata="randomstart(this)"></video>
	<div id="prefetchmaindiv">
	<!-- Hack : make appluncher always loaded (just hidden) so it can be faster when i open/close it -->
	<div id="maindiv">
	<input type="checkbox"  id="realappbarbtu" >
	<div id="clock">
		<p id="clocktime"></p>
		<p id="clockdate"></p>
	</div>
	<div id="appluncher"></div>
	<button id="editbtn">Edit</button>
	<div id="appbar">


		<label for="realappbarbtu" id="appbarbtu">
			<div class="appitem">
				<img src="access/appbar.svg" class="appicon" >
<p class="appname">Apps</p>
			</div>
		</label>
	</div>

	</div>
	</div>
</body>

</html>
