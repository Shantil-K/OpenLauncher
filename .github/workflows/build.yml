# Checks and builds OpenLauncher on every push to main and every pull request, so a broken change shows up straight away.
# The .ipk is kept as a download on the run's page (Actions > Build > the run > Artifacts) for 14 days, for trying a change
# on a TV before it is released. It is not signed: the in-app updater only installs releases, which release.yml builds
# from a version tag and scripts/sign-release.sh signs.
#
# Security: read-only access to the repository, every action pinned to a full commit, and no secrets used, so a pull
# request from a fork can run it safely.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli@3.2.6

      - name: Check the versions match
        run: |
          app=$(node -p "require('./src/appinfo.json').version")
          rel=$(sed -nE 's/^const APP_RELEASE="([^"]*)";.*/\1/p' src/js/about.js)
          echo "appinfo.json: $app, about.js: $rel"
          if [ "$app" != "$rel" ]; then
            echo "::error::src/appinfo.json says $app but APP_RELEASE in src/js/about.js says $rel (use scripts/set-version.sh)"
            exit 1
          fi

      - name: Check scripts
        run: |
          for f in src/js/*.js src/js/lib/*/*.js; do node --check "$f"; done
          for f in src/access/*/*.sh scripts/*.sh tools/home-watch/*.sh; do sh -n "$f"; done
          python3 -m py_compile scripts/*.py tools/home-watch/*.py

      - name: Check every script the page loads exists
        run: |
          missing=0
          for f in $(grep -oE 'src="js/[^"]+"' src/index.html | sed -E 's/src="(.*)"/\1/'); do
            [ -f "src/$f" ] || { echo "::error::index.html loads $f, which doesn't exist"; missing=1; }
          done
          exit $missing

      - name: Build ipk
        run: ares-package src -o .

      - name: Keep the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openlauncher-ipk
          path: com.homebrew.openlauncher_*_all.ipk
          retention-days: 14
          if-no-files-found: error
