# Builds the .ipk and publishes a GitHub release whenever a version tag (v1.2.3 or v1.2.3-beta) is pushed.
# The tag, "version" in src/appinfo.json and APP_RELEASE in src/js/about.js must all match
# (scripts/set-version.sh sets the last two). Tags with a -suffix are published as pre-releases.
# Release notes come from .github/release-notes/<tag>.md, or are generated from commits if that file is missing.
#
# Security: every action is pinned to a full commit (a moved tag can't swap in other code), the job gets only the
# permissions it needs, and the .ipk gets GitHub build provenance (an attestation). The in-app updater installs a release
# only once it is signed with the maintainer's offline key: run scripts/sign-release.sh <tag> after this finishes. That
# script checks the provenance before signing.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the release
  id-token: write      # build provenance (Sigstore)
  attestations: write  # build provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli@3.2.6

      - name: Check the versions match
        run: |
          app=$(node -p "require('./src/appinfo.json').version")
          rel=$(sed -nE 's/^const APP_RELEASE="([^"]*)";.*/\1/p' src/js/about.js)
          echo "appinfo.json: $app, about.js: $rel, ref: $GITHUB_REF_NAME"
          if [ "$app" != "$rel" ]; then
            echo "::error::src/appinfo.json says $app but APP_RELEASE in src/js/about.js says $rel (use scripts/set-version.sh)"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the app says $app but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Check scripts
        run: for f in src/js/*.js; do node --check "$f"; done

      - name: Build ipk
        run: ares-package src -o .

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: com.homebrew.openlauncher_*_all.ipk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          case "$GITHUB_REF_NAME" in *-*) set -- "$@" --prerelease;; esac
          gh release create "$GITHUB_REF_NAME" com.homebrew.openlauncher_*_all.ipk \
            --title "OpenLauncher $GITHUB_REF_NAME" "$@"
